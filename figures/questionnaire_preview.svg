<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850"><rect width="100%" height="100%" fill="#f4f6f8"/><rect x="80" y="35" width="600" height="780" rx="8" fill="white" stroke="#c9d1d9"/><text x="115" y="85" font-family="Arial" font-size="22" font-weight="700">Online Purchase Intention Questionnaire</text><text x="115" y="112" font-family="Arial" font-size="13" fill="#57606a">Portfolio preview - research instrument structure</text><line x1="115" y1="135" x2="645" y2="135" stroke="#c9d1d9"/><g font-family="Arial"><text x="115" y="180" font-size="17" font-weight="700">Section A - Consumer Profile</text><text x="115" y="205" font-size="12">Age • Gender • Income • Online shopping frequency</text><text x="115" y="260" font-size="17" font-weight="700">Section B - Perceived Risk</text><text x="115" y="285" font-size="12">Risk and uncertainty in online purchases</text><text x="115" y="340" font-size="17" font-weight="700">Section C - Payment Trust</text><text x="115" y="365" font-size="12">Confidence in online payment systems</text><text x="115" y="420" font-size="17" font-weight="700">Section D - Delivery Reliability</text><text x="115" y="445" font-size="12">Confidence in delivery and order fulfillment</text><text x="115" y="500" font-size="17" font-weight="700">Section E - Purchase Intention</text><text x="115" y="525" font-size="12">Likelihood and intention to purchase online</text><rect x="115" y="570" width="530" height="150" fill="#f8fafc" stroke="#d0d7de"/><text x="135" y="600" font-size="14" font-weight="700">Example Likert response scale</text><text x="135" y="630" font-size="12">1 Strongly Disagree • 2 Disagree • 3 Neutral</text><text x="135" y="655" font-size="12">4 Agree • 5 Strongly Agree</text><text x="115" y="765" font-size="11" fill="#57606a">Synthetic preview. Replace with the original questionnaire artifact when publishing archival materials.</text></g></svg>